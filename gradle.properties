# ===== AndroidX（必须开启，否则 checkDebugAarMetadata 阶段直接失败）=====
android.useAndroidX=true
android.enableJetifier=false

# ===== 内存受限环境（手机 / Termux）=====
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8 -Duser.country=CN -Duser.language=zh
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=true

# ===== 纯 Java 项目：关闭 AGP 9 的内置 Kotlin，省去 Kotlin 插件依赖下载 =====
# （AGP 8.x 不认识这两项，会被安全忽略）
android.builtInKotlin=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
